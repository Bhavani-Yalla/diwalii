
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffe8ef">
  <title>A Diwali Surprise for Kumaruu ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="hearts" id="hearts"></div>

  <!-- FIRST PAGE -->
  <section class="page active" id="page1">
    <div class="container">

      <h1>Happy Diwali! 🪔</h1>
      <p class="recipient-heading">Kumaruu... <span>♥</span></p>

      <div class="sibling-frame">
        <img src="siblings.png" alt="A special picture for Kumaruu">
      </div>

      <h2>Are you excited for your surprise? 🥰</h2>

      <div class="buttons">
        <button id="yesBtn">Yes! ❤️</button>
        <button id="noBtn">No 🙈</button>
      </div>

    </div>
  </section>


  <!-- SECOND PAGE -->
  <section class="page" id="page2">
    <div class="container">

      <h1>A Little Surprise For You 💌</h1>
      <p class="envelope-hint">Tap the envelope to open your letter!</p>

      <div class="envelope-area">

        <!-- LETTER OPENS ABOVE THE ENVELOPE -->
        <div class="letter" id="letter">
          <div class="letter-content">

            <p class="letter-greeting">Dear Kumaru..,</p>

            <p id="typedMessage" class="typed-message"></p>

            <p class="letter-signature" id="signature">
              From yours sister,<br>
              <span>Babyy.. ♥</span>
            </p>

          </div>
        </div>

        <!-- ENVELOPE -->
        <div class="envelope" id="envelope">

          <div class="envelope-back"></div>

          <div class="letter-preview">
            💗
          </div>

          <div class="envelope-flap"></div>
          <div class="envelope-front"></div>
          <div class="envelope-heart">♥</div>

        </div>

      </div>

      <p class="tap-text" id="tapText">Open me, Kumaruu! 💕</p>

    </div>
  </section>


  <script src="script.js"></script>

</body>
</html>
